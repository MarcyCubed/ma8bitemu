[package]
name = "ma8bitemu"
description = "A no-std library for 8-bit processors emulators"
readme = "README.md"
version = "0.1.0"
edition = "2024"

[dependencies]
clap = { version = "4.6.7", features = ["derive"] , optional = true }

[features]
std = []

[[bin]]
name = "runcpm"
required-features = ["std", "clap"]
[profile.release-line]
inherits = "release"
debug = "line-tables-only"
